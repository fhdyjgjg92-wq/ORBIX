
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBIX</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101525;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 {
  color: #36d9ff;
  font-size: 42px;
}
canvas {
  width: 100%;
  max-width: 600px;
  background: #182238;
  border: 2px solid #36d9ff;
  border-radius: 12px;
  touch-action: none;
}
</style>
</head>
<body>
<h1>ORBIX</h1>
<p>Welcome to ORBIX World!</p>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:300, y:200, r:20};
let food = [];

for(let i=0;i<25;i++){
 food.push({
  x:Math.random()*560+20,
  y:Math.random()*360+20
 });
}

function draw(){
 ctx.clearRect(0,0,600,400);

 food.forEach(f=>{
  ctx.fillStyle="#ffcc44";
  ctx.beginPath();
  ctx.arc(f.x,f.y,5,0,Math.PI*2);
  ctx.fill();
 });

 ctx.fillStyle="#36d9ff";
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();

 requestAnimationFrame(draw);
}
draw();

canvas.addEventListener("pointermove",e=>{
 const rect=canvas.getBoundingClientRect();
 player.x=(e.clientX-rect.left)*600/rect.width;
 player.y=(e.clientY-rect.top)*400/rect.height;
});
</script>
</body>
</html>
