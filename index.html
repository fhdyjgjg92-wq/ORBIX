
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORBIX 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow:hidden
}
header{
 height:65px;display:flex;justify-content:space-between;
 align-items:center;padding:0 18px;background:#111b31
}
h1{color:#36d9ff;font-size:27px;margin:0;letter-spacing:3px}
#stats{font-size:13px;color:#d8eaff;line-height:1.7}
#gameArea{position:relative;width:100%;max-width:900px;margin:auto}
canvas{display:block;width:100%;height:auto;background:#111d33;touch-action:none}
#joystick{
 position:absolute;bottom:18px;left:18px;
 width:125px;height:125px;border-radius:50%;
 background:rgba(100,150,210,.18);
 border:2px solid rgba(150,210,255,.55);
 touch-action:none;display:flex;align-items:center;justify-content:center
}
#stick{
 width:49px;height:49px;border-radius:50%;
 background:#36d9ff;box-shadow:0 0 18px #36d9ff;
 pointer-events:none
}
#hint{color:#a8c5e8;font-size:12px;padding:8px}
</style>
</head>
<body>

<header>
<h1>ORBIX</h1>
<div id="stats">
النقاط: <span id="score">0</span><br>
الحجم: <span id="size">20</span>
</div>
</header>

<div id="gameArea">
<canvas id="game" width="900" height="600"></canvas>
<div id="joystick"><div id="stick"></div></div>
</div>
<div id="hint">حرّك عصا التحكم لتوجيه ORBIX</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

const W=900,H=600;
const world={width:2600,height:2000};

const player={
 x:1300,y:1000,r:20,
 speed:3.2,color:"#36d9ff",score:0
};

let camera={x:0,y:0};
let food=[];
const input={x:0,y:0};
const keys={};

function randomFood(){
 return {
  x:20+Math.random()*(world.width-40),
  y:20+Math.random()*(world.height-40),
  r:5,
  color:["#ffcc44","#ff6b9d","#7cff91","#b58cff"]
  [Math.floor(Math.random()*4)]
 };
}

for(let i=0;i<250;i++)food.push(randomFood());

function update(){
 let dx=input.x,dy=input.y;

 if(keys.ArrowLeft||keys.a)dx-=1;
 if(keys.ArrowRight||keys.d)dx+=1;
 if(keys.ArrowUp||keys.w)dy-=1;
 if(keys.ArrowDown||keys.s)dy+=1;

 const length=Math.hypot(dx,dy);

 if(length>0){
  dx/=Math.max(1,length);
  dy/=Math.max(1,length);
  player.x+=dx*player.speed;
  player.y+=dy*player.speed;
 }

 player.x=Math.max(player.r,
 Math.min(world.width-player.r,player.x));
 player.y=Math.max(player.r,
 Math.min(world.height-player.r,player.y));

 // الكاميرا تتبع اللاعب
 camera.x=Math.max(0,Math.min(world.width-W,player.x-W/2));
 camera.y=Math.max(0,Math.min(world.height-H,player.y-H/2));

 // أكل الطعام والنمو
 for(let i=food.length-1;i>=0;i--){
  const f=food[i];
  const distance=Math.hypot(player.x-f.x,player.y-f.y);

  if(distance<player.r+f.r){
   food.splice(i,1);
   player.score++;
   player.r=Math.min(65,player.r+0.18);
   player.speed=Math.max(1.8,3.2-player.r*0.012);
   food.push(randomFood());
  }
 }

 document.getElementById("score").textContent=player.score;
 document.getElementById("size").textContent=Math.round(player.r);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 ctx.fillStyle="#111d33";
 ctx.fillRect(0,0,world.width,world.height);

 // شبكة العالم
 ctx.strokeStyle="rgba(130,180,230,.09)";
 ctx.lineWidth=1;

 for(let x=0;x<=world.width;x+=50){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,world.height);
  ctx.stroke();
 }

 for(let y=0;y<=world.height;y+=50){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(world.width,y);
  ctx.stroke();
 }

 // حدود الخريطة
 ctx.strokeStyle="#36d9ff";
 ctx.lineWidth=5;
 ctx.strokeRect(0,0,world.width,world.height);

 // الطعام
 food.forEach(f=>{
  ctx.fillStyle=f.color;
  ctx.shadowColor=f.color;
  ctx.shadowBlur=9;
  ctx.beginPath();
  ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
  ctx.fill();
 });

 ctx.shadowBlur=0;

 // اللاعب
 ctx.fillStyle=player.color;
 ctx.shadowColor=player.color;
 ctx.shadowBlur=24;
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.fillStyle="white";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText("ORBIX",player.x,player.y+5);

 ctx.restore();
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

// عصا التحكم
let activePointer=null;

function moveJoystick(e){
 const rect=joystick.getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const max=rect.width*0.34;
 const distance=Math.hypot(dx,dy);

 if(distance>max){
  dx=dx/distance*max;
  dy=dy/distance*max;
 }

 stick.style.transform=`translate(${dx}px,${dy}px)`;
 input.x=dx/max;
 input.y=dy/max;
}

joystick.addEventListener("pointerdown",e=>{
 activePointer=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===activePointer)moveJoystick(e);
});

function stopJoystick(e){
 if(e.pointerId!==activePointer)return;
 activePointer=null;
 input.x=0;
 input.y=0;
 stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);

// لوحة المفاتيح
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

loop();
</script>
</body>
</html>
